name: Hexo Deploy
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy
          path: ./
      
      - name: Update submodules
        run: |
          git submodule init
          git submodule update
          rm themes/cactus/_config.yml
          mv ./_config.cactus.yml themes/cactus/_config.yml
  
      - name: Checkout blog repo
        uses: actions/checkout@v4
        with:
          ref: main
          path: ./source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci
          npm run build
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['public/sitemap.xml', 'public/baidusitemap.xml']) {
            let xml = fs.readFileSync(file, 'utf8');
            xml = xml.replace(/(<loc>)([\s\S]*?)(<\/loc>)/g, (_, open, value, close) => {
              const escaped = value
                .replace(/&amp;/g, '&')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
              return open + escaped + close;
            });
            fs.writeFileSync(file, xml);
          }
          NODE
          cp ./source/js/search.js ./public/js/search.js
          mv ./source/google8b558a008d59b84e.html ./public/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: medasz/medasz.github.io
          branch: html
          folder: public
          token: ${{secrets.GITHUB_TOKEN}}
